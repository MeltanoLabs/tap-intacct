[project]
name = "meltanolabs-tap-intacct"
dynamic = ["version"]
description = "Singer tap for Intacct, built with the Meltano Singer SDK."
authors = [{ name = "Pat Nadolny", email = "pat@arch.dev" }]
requires-python = ">=3.10"
readme = "README.md"
license = "Apache-2.0"
keywords = [
    "ELT",
    "Intacct",
]
classifiers = [
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "backports-datetime-fromisoformat==2.0.3 ; python_full_version < '3.11'",
    "singer-sdk~=0.54.5",
    "typing-extensions>=4.16.0 ; python_full_version < '3.12'",
    "xmltodict~=1.0.4",
]

[project.scripts]
tap-intacct = "tap_intacct.tap:TapIntacct.cli"

[dependency-groups]
dev = [
    "pytest>=9",
    "singer-sdk[testing]",
]

[tool.uv]
default-groups = "all"

[tool.hatch.build.targets.sdist]
include = ["tap_intacct"]

[tool.hatch.build.targets.wheel]
include = ["tap_intacct"]

[tool.hatch.version]
fallback-version = "0.0.0.dev0"
source = "vcs"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
addopts = '--durations=10'

[tool.mypy]
warn_unused_configs = true

[tool.ruff]
line-length = 100
preview = true

[tool.ruff.lint]
ignore = [
    "missing-copyright-notice",
    "missing-trailing-comma",
    "single-line-implicit-string-concatenation",
    "commented-out-code",
]
select = ["ALL"]

[tool.ruff.lint.flake8-annotations]
allow-star-arg-any = true

[tool.ruff.lint.pydocstyle]
convention = "google"
